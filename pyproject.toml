[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unicell-fig5"
version = "0.2.1"
description = "UniCell Fig5 training and inference package"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9,<3.10"
dependencies = [
    "anndata>=0.10,<0.11",
    "datasets>=2.17,<2.18",
    "einops>=0.8,<0.9",
    "h5py>=3.9,<4",
    "lmdb>=1.3,<2",
    "local-attention>=1.8,<1.9",
    "loompy>=3.0,<3.1",
    "matplotlib>=3.8,<3.9",
    "munch>=4,<5",
    "networkx>=3.2,<3.3",
    "numba>=0.59,<0.60",
    "numpy>=1.26,<2",
    "obonet>=1.0,<2",
    "pandas>=2.2,<2.3",
    "scanpy>=1.9,<1.10",
    "scikit-learn>=1.6,<1.7",
    "scipy>=1.11,<1.12",
    "seaborn>=0.13,<0.14",
    "toml>=0.10,<0.11",
    "torch>=2.0,<2.1",
    "torchdata>=0.6,<0.8",
    "torchtext>=0.15,<0.16",
    "tqdm>=4.66,<4.67",
    "transformers>=4.35,<4.36",
]

[project.scripts]
unicell-predict = "predict:main"
unicell-predict-chunks = "predict_by_sample_chunks:main"
unicell-train = "train_Unicell:main"
unicell-train-backbone = "unicell.cli.train_backbone:main"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
py-modules = ["predict", "predict_by_sample_chunks", "train_Unicell"]

[tool.setuptools.packages.find]
where = ["."]
include = ["unicell*"]
namespaces = true

[tool.setuptools.package-data]
unicell = ["*.obo", "*.gml"]
"unicell.repo.geneformer" = ["*.json"]
"unicell.repo.scgpt.tokenizer" = ["*.json"]
